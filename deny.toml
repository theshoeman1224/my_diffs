# cargo-deny: license, advisory, ban and source checks. Run with `just deny`.

[advisories]
version = 2
ignore = [
    # humantime is flagged unmaintained (it wraps chrono). It is only reached
    # through trycmd, a dev-dependency, so it never ships in the binary, and no
    # trycmd release avoids it yet. Re-check when trycmd updates.
    { id = "RUSTSEC-2026-0542", reason = "dev-only via trycmd; unmaintained, not a vulnerability; no fixed release" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
